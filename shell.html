    <!-- Every reel and poster comes from here (shared/reel-versions.ts); connect while the HTML is still arriving. -->
    <link rel="preconnect" href="https://media.codeandchill.store">
    <!-- Every page waits on the catalogue (CatalogProvider); fetch it beside the JS, not after it. -->
    <link rel="preload" href="api/products" as="fetch" crossorigin="">

    <meta name="theme-color" content="#f0eee9" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#171615" media="(prefers-color-scheme: dark)">
    <script>
      // Paint the stored theme before first paint, so the page never flashes.
      (() => {
        try {
          const stored = localStorage.getItem('instrument:theme');
          const theme =
            stored ?? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch {}
      })();
    </script>
